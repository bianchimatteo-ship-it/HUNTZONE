name: Verify HUNTZONE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Typecheck frontend and game core
        run: npm run typecheck
      - name: Typecheck multiplayer API
        run: npm run api:typecheck
      - name: Build Cloudflare Pages output
        run: npm run build
      - name: Verify GitHub Pages base-path compatibility
        run: npm run build:github-pages
