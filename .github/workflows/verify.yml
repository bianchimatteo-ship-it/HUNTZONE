name: Verify HUNTZONE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_DB: huntzone_test
          POSTGRES_USER: huntzone
          POSTGRES_PASSWORD: huntzone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huntzone -d huntzone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://huntzone:huntzone_test@localhost:5432/huntzone_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Run PostgreSQL/PostGIS integration tests
        run: npm run api:test:integration
      - name: Typecheck frontend and game core
        run: npm run typecheck
      - name: Typecheck multiplayer API
        run: npm run api:typecheck
      - name: Build multiplayer API
        run: npm run api:build
      - name: Build Cloudflare Pages output
        run: npm run build
      - name: Verify GitHub Pages base-path compatibility
        run: npm run build:github-pages
